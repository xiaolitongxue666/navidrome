services:
  navidrome:
    image: deluan/navidrome:0.64.0
    container_name: navidrome
    user: "1000:1000"
    ports:
      - "127.0.0.1:4533:4533"
    restart: unless-stopped
    environment:
      ND_BASEURL: /music
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_SCANSCHEDULE: "@every 15m"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLEEXTERNALSERVICES: "true"
      ND_COVERARTPRIORITY: "embedded,external,cover.*,folder.*,front.*"
      ND_DEFAULTTHEME: "Tokyo Night"
    volumes:
      - ${NAVIDROME_DATA:-/home/ubuntu/navidrome/data}:/data
      - ${NAVIDROME_MUSIC:-/home/ubuntu/music}:/music:ro
